name: Clojure CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: clojure:openjdk-17-tools-deps-slim-bullseye@sha256:d5577c7b5ee914a7c187818f2669f01091ef5aa4b3a2aa9ce13e980eb54613de

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Cache mvn/git deps
        uses: actions/cache@v6.1.0
        id: cache-deps
        with:
          path: |
            /root/.gitlibs
            /root/.m2
          key: ${{ runner.os }}-${{ hashFiles('**/deps.edn') }}

      - name: Lint
        run: clojure -T:project lint

      - name: Format
        run: clojure -T:project format-check

      - name: Run tests
        run: clj -X:test
